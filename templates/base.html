<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        .nav { background: #1f2937; padding: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .nav a { color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; }
        .nav a.active { background: #2563eb; }
        .content { padding: 24px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 16px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
        <a href="/dashboard/" class="{% if '/dashboard/' in request.path %}active{% endif %}">Dashboard</a>
        <a href="/orders/" class="{% if '/orders/' in request.path %}active{% endif %}">Orders</a>
        <a href="/customers/" class="{% if '/customers/' in request.path %}active{% endif %}">Customers</a>
        <a href="/inventory/" class="{% if '/inventory/' in request.path %}active{% endif %}">Inventory</a>
        <a href="/reports/" class="{% if '/reports/' in request.path %}active{% endif %}">Reports</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
